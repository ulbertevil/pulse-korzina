name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - name: Тесты, в том числе сайт в браузере
        run: python -m pytest -q
      - name: Картинка-превью для ссылки
        continue-on-error: true
        run: python scripts/og_image.py
      - name: Версия файлов в ссылках, чтобы браузер не взял старый скрипт
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$V\"|; s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|src=\"tour.js\"|src=\"tour.js?v=$V\"|" site/index.html
          sed -i "s|new Worker(\"worker.js\")|new Worker(\"worker.js?v=$V\")|" site/app.js
          sed -i "s|importScripts(\"model.js\")|importScripts(\"model.js?v=$V\")|" site/worker.js
          grep -c "?v=$V" site/index.html site/app.js site/worker.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
